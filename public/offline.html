<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Storybook Flipbook</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAF7F2;
      color: #1F2937;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid #E5DFD3;
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(30, 58, 95, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      color: #1E3A5F;
      font-size: 1.4rem;
    }
    p {
      margin: 0 0 24px;
      color: #6B7280;
      line-height: 1.7;
    }
    button {
      background: #1E3A5F;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You Are Offline</h1>
    <p>It looks like there is no internet connection right now. Please check your connection and try again to read the story.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
